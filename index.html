<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פועלי בניין</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800&family=Heebo:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#E4E3DE; --surface:#FFFFFF; --surface-2:#F5F4F1;
    --ink:#191E24; --ink-2:#535D66; --ink-3:#8A9199;
    --line:#D3D2CC; --line-2:#E7E6E1; --field:#FFFFFF;
    --band:#1B222A; --band-ink:#F2F1EC; --focus:#191E24;
    --new-bg:#FBE6DA; --new-fg:#8F3310; --new-dot:#C2530C;
    --wip-bg:#F8EECD; --wip-fg:#6E5000; --wip-dot:#A97400;
    --done-bg:#DCEEE1; --done-fg:#1E5738; --done-dot:#2C7A50;
    --shadow:0 1px 2px rgba(25,30,36,.05), 0 12px 32px -24px rgba(25,30,36,.6);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --canvas:#12161B; --surface:#1A2027; --surface-2:#222932; --band:#0C1015;
      --ink:#ECEDE9; --ink-2:#A5ADB5; --ink-3:#79828B;
      --line:#2E3742; --line-2:#262E37; --field:#141A20; --band-ink:#ECEDE9;
      --focus:#ECEDE9;
      --new-bg:#3B2013; --new-fg:#F3BD9C; --new-dot:#DD6A2E;
      --wip-bg:#3A3010; --wip-fg:#EED892; --wip-dot:#C79D1F;
      --done-bg:#123123; --done-fg:#9CD5B6; --done-dot:#3B9A6C;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -24px #000;
    }
  }
  :root[data-theme="dark"]{
    --canvas:#12161B; --surface:#1A2027; --surface-2:#222932; --band:#0C1015;
    --ink:#ECEDE9; --ink-2:#A5ADB5; --ink-3:#79828B;
    --line:#2E3742; --line-2:#262E37; --field:#141A20; --band-ink:#ECEDE9;
    --focus:#ECEDE9;
    --new-bg:#3B2013; --new-fg:#F3BD9C; --new-dot:#DD6A2E;
    --wip-bg:#3A3010; --wip-fg:#EED892; --wip-dot:#C79D1F;
    --done-bg:#123123; --done-fg:#9CD5B6; --done-dot:#3B9A6C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -24px #000;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--canvas);color:var(--ink);
    font-family:"Heebo","Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.5;
    -webkit-text-size-adjust:100%}
  .wrap{max-width:1150px;margin:0 auto;padding:0 18px 72px}

  .band{background:var(--band);color:var(--band-ink)}
  .band-in{max-width:1150px;margin:0 auto;padding:20px 18px 22px;
    display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .mark{display:flex;align-items:baseline;gap:12px}
  h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:800;font-size:34px;
    margin:0;letter-spacing:-.015em;line-height:1}
  .sub{font-size:13.5px;color:#9AA3AC;padding-bottom:2px}
  .course{font-family:"Heebo",sans-serif;font-size:14px;color:var(--band-ink);
    background:transparent;border:none;border-bottom:1px dashed #3B444E;
    padding:3px 4px;min-width:110px;max-width:260px}
  .course::placeholder{color:#6E7780}
  .course:focus{outline:none;border-bottom-color:var(--band-ink)}
  .right{margin-inline-start:auto;display:flex;align-items:center;gap:14px;padding-bottom:3px}
  .sync{font-size:12.5px;color:#9AA3AC;display:flex;align-items:center;gap:7px}
  .sync b{width:7px;height:7px;border-radius:50%;background:var(--done-dot)}
  .sync.off b{background:var(--new-dot)}
  .signout{background:transparent;border:1px solid #3B444E;color:#9AA3AC;
    border-radius:2px;padding:5px 11px;font-size:12.5px;cursor:pointer}
  .signout:hover{color:var(--band-ink);border-color:#5A646E}

  /* ---------- התחברות ---------- */
  .gate{max-width:380px;margin:12vh auto 0;background:var(--surface);
    border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow);padding:26px}
  .gate h2{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;
    font-size:24px;margin:0 0 4px}
  .gate p{margin:0 0 20px;color:var(--ink-2);font-size:13.5px}
  .gate label{display:block;font-size:13px;color:var(--ink-2);margin:0 0 5px}
  .gate .fld{width:100%;margin-bottom:14px}
  .gate .btn{width:100%}
  .err{background:var(--new-bg);color:var(--new-fg);border-radius:2px;
    padding:9px 11px;font-size:13px;margin-bottom:14px}

  .gauge{margin:26px 0 8px}
  .gauge-top{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
  .gauge-top .big{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;
    font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
  .gauge-top .cap{font-size:14px;color:var(--ink-2)}
  .bar{display:flex;height:12px;background:var(--line-2);border-radius:2px;overflow:hidden}
  .bar span{display:block;height:100%;min-width:0;transition:width .35s ease}
  .bar .s-new{background:var(--new-dot)} .bar .s-wip{background:var(--wip-dot)}
  .bar .s-done{background:var(--done-dot)}

  .keys{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .key{display:flex;align-items:center;gap:8px;background:var(--surface);
    border:1px solid var(--line);border-radius:2px;padding:7px 12px;
    font:inherit;font-size:13.5px;color:var(--ink-2);cursor:pointer}
  .key i{width:9px;height:9px;border-radius:50%;font-style:normal}
  .key .kn{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .key:hover{background:var(--surface-2)}
  .key[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
  .k-all i{background:var(--ink-3)} .k-new i{background:var(--new-dot)}
  .k-wip i{background:var(--wip-dot)} .k-done i{background:var(--done-dot)}

  .plugot{display:flex;margin:24px 0 14px;border-bottom:1px solid var(--line);
    overflow-x:auto;scrollbar-width:none}
  .plugot::-webkit-scrollbar{display:none}
  .pl{font:inherit;font-size:15px;background:transparent;border:none;cursor:pointer;
    color:var(--ink-2);padding:9px 16px 11px;white-space:nowrap;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .pl:hover{color:var(--ink)}
  .pl[aria-pressed="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
  .pl .badge{font-size:12px;color:var(--ink-3);margin-inline-start:6px;
    font-variant-numeric:tabular-nums}
  .pl[aria-pressed="true"] .badge{color:var(--new-fg)}

  .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input,select,textarea,button{font-family:inherit;font-size:14px;color:var(--ink)}
  .fld{background:var(--field);border:1px solid var(--line);border-radius:2px;padding:9px 11px}
  .fld:focus{outline:2px solid var(--focus);outline-offset:-2px;border-color:var(--focus)}
  .search{flex:1;min-width:200px}
  .btn{background:var(--ink);color:var(--surface);border:1px solid var(--ink);
    border-radius:2px;padding:9px 18px;cursor:pointer;font-weight:500}
  .btn:hover{opacity:.88}
  .btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
  .btn:focus-visible,.pl:focus-visible,.key:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:2px;
    box-shadow:var(--shadow);overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:840px}
  thead th{text-align:start;font-size:11.5px;font-weight:500;color:var(--ink-2);
    padding:11px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);
    white-space:nowrap;letter-spacing:.02em}
  tbody td{padding:5px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
  tbody tr:hover{background:var(--surface-2)}
  .cell{width:100%;background:transparent;border:1px solid transparent;border-radius:2px;
    padding:8px;font-size:14.5px}
  .cell:hover{border-color:var(--line-2)}
  .cell:focus{outline:none;border-color:var(--focus);background:var(--field)}
  select.cell{cursor:pointer}
  .col-i{width:42px;color:var(--ink-3);font-size:12px;text-align:center;
    font-variant-numeric:tabular-nums}
  .col-co{width:120px} .col-lo{width:180px} .col-st{width:146px}
  .col-no{width:200px} .col-x{width:42px}
  .st{border:1px solid transparent;border-radius:999px;padding:7px 10px;width:100%;
    font-weight:500;font-size:13px;cursor:pointer;appearance:none;text-align:center}
  .st-new{background:var(--new-bg);color:var(--new-fg)}
  .st-wip{background:var(--wip-bg);color:var(--wip-fg)}
  .st-done{background:var(--done-bg);color:var(--done-fg)}
  .del{background:transparent;border:none;color:var(--ink-3);cursor:pointer;
    font-size:19px;line-height:1;padding:6px 8px;border-radius:2px}
  .del:hover{background:var(--new-bg);color:var(--new-fg)}
  tr.adder td{background:var(--surface-2);border-top:1px solid var(--line);border-bottom:none}
  tr.adder .cell{border-color:var(--line);background:var(--field)}
  tr.is-done .col-gap .cell{color:var(--ink-2)}

  .empty{padding:48px 22px;text-align:center;color:var(--ink-2);
    border-bottom:1px solid var(--line-2)}
  .empty h3{font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:500;font-size:20px;
    margin:0 0 7px;color:var(--ink)}
  .foot{margin-top:16px;font-size:12.5px;color:var(--ink-3);text-align:center}

  @media (max-width:820px){
    h1{font-size:27px} .gauge-top .big{font-size:33px}
    table,thead,tbody,tr,td{display:block;width:auto}
    table{min-width:0} thead{display:none}
    tbody tr{border-bottom:1px solid var(--line);padding:10px 12px 12px}
    tbody tr:last-of-type{border-bottom:none}
    tbody td{border:none;padding:4px 0;display:flex;align-items:center;gap:10px}
    tbody td::before{content:attr(data-lbl);flex:0 0 74px;font-size:12px;color:var(--ink-3)}
    .col-i{display:none} .col-x{justify-content:flex-end}
    .cell{border-color:var(--line-2);background:var(--field)}
    tr.adder td{background:transparent}
    .col-co,.col-lo,.col-st,.col-no,.col-x{width:auto}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="band">
  <div class="band-in">
    <div class="mark">
      <h1>פועלי בניין</h1>
      <span class="sub">מעקב פערי בינוי</span>
    </div>
    <input class="course" id="courseName" placeholder="שם הקורס" aria-label="שם הקורס" hidden>
    <div class="right">
      <div class="sync off" id="sync"><b></b><span>מתחבר…</span></div>
      <button class="signout" id="signout" hidden>יציאה</button>
    </div>
  </div>
</div>

<!-- ============ מסך התחברות ============ -->
<div id="gate" class="gate" hidden>
  <h2>כניסה למערכת</h2>
  <p>הרשימה פתוחה לאנשי הצוות בלבד.</p>
  <div class="err" id="gateErr" hidden></div>
  <label for="email">דואר אלקטרוני</label>
  <input class="fld" id="email" type="email" autocomplete="username">
  <label for="pass">סיסמה</label>
  <input class="fld" id="pass" type="password" autocomplete="current-password">
  <button class="btn" id="login">כניסה</button>
</div>

<!-- ============ האפליקציה ============ -->
<div class="wrap" id="app" hidden>

  <div class="gauge">
    <div class="gauge-top">
      <span class="big" id="openCount">0</span>
      <span class="cap" id="gaugeCap">פערים פתוחים</span>
    </div>
    <div class="bar" role="img" aria-label="חלוקת הפערים לפי סטטוס">
      <span class="s-new" id="bNew" style="width:0%"></span>
      <span class="s-wip" id="bWip" style="width:0%"></span>
      <span class="s-done" id="bDone" style="width:0%"></span>
    </div>
    <div class="keys">
      <button class="key k-all" data-f="all" aria-pressed="true"><i></i><span class="kn" id="c-all">0</span> הכל</button>
      <button class="key k-new" data-f="טרם הועלה" aria-pressed="false"><i></i><span class="kn" id="c-new">0</span> טרם הועלה</button>
      <button class="key k-wip" data-f="בטיפול" aria-pressed="false"><i></i><span class="kn" id="c-wip">0</span> בטיפול</button>
      <button class="key k-done" data-f="טופל" aria-pressed="false"><i></i><span class="kn" id="c-done">0</span> טופל</button>
    </div>
  </div>

  <div class="plugot" id="plugot"></div>

  <div class="tools">
    <input class="fld search" id="q" type="search" placeholder="חיפוש בפער, במיקום או בהערות" aria-label="חיפוש">
    <select class="fld" id="fLocation" aria-label="סינון לפי מיקום"></select>
    <button class="btn ghost" id="export">ייצוא לאקסל</button>
  </div>

  <div class="panel">
    <div class="scroll">
      <table>
        <thead>
          <tr>
            <th class="col-i">#</th><th class="col-co">פלוגה</th><th>פער</th>
            <th class="col-lo">מיקום</th><th class="col-st">סטטוס</th>
            <th class="col-no">הערות</th><th class="col-x"></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
        <tbody>
          <tr class="adder">
            <td class="col-i">+</td>
            <td class="col-co" data-lbl="פלוגה"><select class="cell" id="nCompany"></select></td>
            <td class="col-gap" data-lbl="פער"><input class="cell" id="nGap" placeholder="מה הפער?"></td>
            <td class="col-lo" data-lbl="מיקום"><select class="cell" id="nLocation"></select></td>
            <td class="col-st" data-lbl="סטטוס"><select class="cell st st-new" id="nStatus">
              <option>טרם הועלה</option><option>בטיפול</option><option>טופל</option>
            </select></td>
            <td class="col-no" data-lbl="הערות"><input class="cell" id="nNote" placeholder="הערות"></td>
            <td class="col-x"><button class="btn" id="add" style="padding:8px 14px">הוספה</button></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>
      <h3>אין פערים ברשימה</h3>
      <div>הוסיפו פער בשורה התחתונה של הטבלה. כל מי שיפתח את הדף יראה אותו מיד.</div>
    </div>
  </div>

  <div class="foot" id="foot">כל שינוי נשמר אוטומטית ומופיע אצל כל מי שהדף פתוח אצלו.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  "use strict";

  /* ==========================================================
     הגדרות — מלאו את שני הערכים מ‑Supabase:
     Project Settings › API › Project URL ו‑anon public key
     ========================================================== */
  var SUPABASE_URL      = "https://mkrvwgiheeiwwbmlohwe.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_YAfAFtl9gR71ygNGDnE3Mg_snM5cWtJ";
  /* ========================================================== */

  var COMPANIES = ["בשור","צין","פארן","תמר","רמון"];
  var LOCATIONS = ["מגורי בנות","מגורי בנים","פינת ישיבה","פינת פריסה","דקצ\"ו (דק קמנים)",
    "שביל","דשא","פינת גלח\"צ","מתחם קמנים","ספריית קמנים","רחבת רמון",
    "פינת קק\"ס","פינת עישון"];
  var NEEDS_DETAIL = {"שביל":"איזה שביל?","דשא":"איזה דשא?"};
  var STATUSES = ["טרם הועלה","בטיפול","טופל"];
  var CLS = {"טרם הועלה":"st-new","בטיפול":"st-wip","טופל":"st-done"};

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var rows = [], courseName = "";
  var fStatus = "all", fCompany = "all", timers = {}, channel = null;

  var $ = function(id){ return document.getElementById(id); };
  var el = {rows:$("rows"),empty:$("empty"),sync:$("sync"),q:$("q"),fLocation:$("fLocation"),
    course:$("courseName"),nCompany:$("nCompany"),nGap:$("nGap"),nLocation:$("nLocation"),
    nStatus:$("nStatus"),nNote:$("nNote"),plugot:$("plugot"),gate:$("gate"),app:$("app")};

  function setSync(ok,text){
    el.sync.className="sync"+(ok?"":" off");
    el.sync.lastChild.textContent=text;
  }
  function opt(v,label){var o=document.createElement("option");o.value=v;o.textContent=label||v;return o;}

  COMPANIES.forEach(function(c){ el.nCompany.appendChild(opt(c)); });
  LOCATIONS.forEach(function(l){ el.nLocation.appendChild(opt(l)); });
  el.fLocation.appendChild(opt("","כל המיקומים"));
  LOCATIONS.forEach(function(l){ el.fLocation.appendChild(opt(l)); });

  var allBtn = document.createElement("button");
  allBtn.className="pl"; allBtn.type="button"; allBtn.dataset.co="all";
  allBtn.setAttribute("aria-pressed","true");
  allBtn.innerHTML='<span>כל הפלוגות</span><span class="badge"></span>';
  allBtn.addEventListener("click",function(){ fCompany="all"; render(); });
  el.plugot.appendChild(allBtn);
  COMPANIES.forEach(function(c){
    var b=document.createElement("button");
    b.className="pl"; b.type="button"; b.dataset.co=c;
    b.setAttribute("aria-pressed","false");
    b.innerHTML='<span></span><span class="badge"></span>';
    b.firstChild.textContent=c;
    b.addEventListener("click",function(){ fCompany=(fCompany===c)?"all":c; render(); });
    el.plugot.appendChild(b);
  });

  /* ---------------- התחברות ---------------- */
  function showGate(msg){
    el.gate.hidden=false; el.app.hidden=true;
    el.course.hidden=true; $("signout").hidden=true;
    setSync(false,"לא מחובר");
    if(msg){ $("gateErr").hidden=false; $("gateErr").textContent=msg; }
  }
  function showApp(){
    el.gate.hidden=true; el.app.hidden=false;
    el.course.hidden=false; $("signout").hidden=false;
    setSync(true,"מסונכרן");
    loadAll(); subscribe();
  }
  $("login").addEventListener("click", signIn);
  $("pass").addEventListener("keydown",function(e){ if(e.key==="Enter") signIn(); });
  $("email").addEventListener("keydown",function(e){ if(e.key==="Enter") $("pass").focus(); });

  function signIn(){
    $("gateErr").hidden=true;
    sb.auth.signInWithPassword({email:$("email").value.trim(), password:$("pass").value})
      .then(function(r){
        if(r.error){ showGate("הכניסה נכשלה. בדקו את הדואר והסיסמה."); return; }
        $("pass").value=""; showApp();
      });
  }
  $("signout").addEventListener("click",function(){
    if(channel){ sb.removeChannel(channel); channel=null; }
    sb.auth.signOut().then(function(){ rows=[]; render(); showGate(); });
  });

  sb.auth.getSession().then(function(r){
    if(r.data && r.data.session) showApp(); else showGate();
  });

  /* ---------------- טעינה וסנכרון ---------------- */
  function loadAll(){
    sb.from("gaps").select("*").order("created_at",{ascending:false}).limit(2000)
      .then(function(r){
        if(r.error){ setSync(false,"טעינת הנתונים נכשלה"); return; }
        rows = (r.data||[]).map(function(v){
          return {id:v.id, company:v.company||"", gap:v.gap||"", location:v.location||"",
            status:STATUSES.indexOf(v.status)>-1?v.status:"טרם הועלה", note:v.note||""};
        });
        setSync(true,"מסונכרן"); render();
      });
    sb.from("settings").select("course_name").eq("id",1).single()
      .then(function(r){
        if(r.data){
          courseName = r.data.course_name||"";
          if(document.activeElement!==el.course) el.course.value=courseName;
          document.title=(courseName?courseName+" — ":"")+"פועלי בניין";
        }
      });
  }
  function subscribe(){
    if(channel) return;
    channel = sb.channel("gaps-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"gaps"}, loadAll)
      .on("postgres_changes",{event:"*",schema:"public",table:"settings"}, loadAll)
      .subscribe();
  }

  /* ---------------- כתיבה ---------------- */
  function find(id){for(var i=0;i<rows.length;i++) if(rows[i].id===id) return rows[i]; return null;}
  function writeRow(id,patch){
    var r=find(id); if(r) Object.keys(patch).forEach(function(k){r[k]=patch[k];});
    sb.from("gaps").update(patch).eq("id",id).then(function(res){
      if(res.error) setSync(false,"השמירה נכשלה");
    });
  }
  function debounced(id,field,value){
    var k=id+"|"+field; clearTimeout(timers[k]);
    timers[k]=setTimeout(function(){var p={};p[field]=value;writeRow(id,p);},450);
  }
  function addRow(){
    var gap=el.nGap.value.trim(); if(!gap){ el.nGap.focus(); return; }
    var rec={company:el.nCompany.value,gap:gap,location:el.nLocation.value,
      status:el.nStatus.value,note:el.nNote.value.trim()};
    el.nGap.value=""; el.nNote.value="";
    sb.from("gaps").insert(rec).select().then(function(r){
      if(r.error){ setSync(false,"ההוספה נכשלה"); return; }
      if(r.data&&r.data[0]&&!find(r.data[0].id)){ rows.unshift(r.data[0]); render(); }
    });
    el.nGap.focus();
  }
  function removeRow(id){
    var r=find(id);
    if(!confirm("למחוק את הפער"+(r&&r.gap?' "'+r.gap+'"':"")+"?")) return;
    rows=rows.filter(function(x){return x.id!==id;}); render();
    sb.from("gaps").delete().eq("id",id).then(function(res){
      if(res.error) setSync(false,"המחיקה נכשלה");
    });
  }

  /* ---------------- תצוגה ---------------- */
  function visible(){
    var q=el.q.value.trim(), lo=el.fLocation.value;
    return rows.filter(function(r){
      if(fStatus!=="all"&&r.status!==fStatus) return false;
      if(fCompany!=="all"&&r.company!==fCompany) return false;
      if(lo&&r.location!==lo) return false;
      if(q&&(r.gap+" "+r.company+" "+r.note+" "+r.location).indexOf(q)===-1) return false;
      return true;
    });
  }
  function render(){
    var n=rows.filter(function(r){return r.status==="טרם הועלה";}).length,
        w=rows.filter(function(r){return r.status==="בטיפול";}).length,
        d=rows.filter(function(r){return r.status==="טופל";}).length,
        t=rows.length||1;
    $("c-all").textContent=rows.length; $("c-new").textContent=n;
    $("c-wip").textContent=w; $("c-done").textContent=d;
    $("openCount").textContent=n+w;
    $("gaugeCap").textContent = rows.length===0 ? "אין פערים רשומים" : "פערים פתוחים מתוך "+rows.length;
    $("bNew").style.width=(n/t*100)+"%";
    $("bWip").style.width=(w/t*100)+"%";
    $("bDone").style.width=(d/t*100)+"%";

    Array.prototype.forEach.call(document.querySelectorAll(".key"),function(k){
      k.setAttribute("aria-pressed",String(k.dataset.f===fStatus));
    });
    Array.prototype.forEach.call(el.plugot.children,function(b){
      var co=b.dataset.co;
      b.setAttribute("aria-pressed",String(co===fCompany));
      var open = co==="all"
        ? rows.filter(function(r){return r.status!=="טופל";}).length
        : rows.filter(function(r){return r.company===co&&r.status!=="טופל";}).length;
      b.lastChild.textContent = open ? open : "";
    });

    var f=document.activeElement, memo=null;
    if(f&&f.dataset&&f.dataset.id)
      memo={id:f.dataset.id,f:f.dataset.field,s:(f.selectionStart!=null?f.selectionStart:null)};

    var list=visible();
    el.rows.innerHTML="";
    list.forEach(function(r,i){
      var tr=document.createElement("tr");
      if(r.status==="טופל") tr.className="is-done";
      tr.appendChild(td("col-i","",document.createTextNode(String(i+1))));
      tr.appendChild(td("col-co","פלוגה",select(r,"company",COMPANIES)));
      tr.appendChild(td("col-gap","פער",input(r,"gap","תיאור הפער")));
      tr.appendChild(td("col-lo","מיקום",select(r,"location",LOCATIONS)));
      tr.appendChild(td("col-st","סטטוס",statusSelect(r)));
      tr.appendChild(td("col-no","הערות",input(r,"note",NEEDS_DETAIL[r.location]||"הערות")));
      var b=document.createElement("button");
      b.className="del"; b.type="button"; b.textContent="×";
      b.setAttribute("aria-label","מחיקת הפער"); b.title="מחיקת הפער";
      b.addEventListener("click",function(){removeRow(r.id);});
      tr.appendChild(td("col-x","",b));
      el.rows.appendChild(tr);
    });

    el.empty.hidden=list.length>0;
    if(list.length===0){
      var filtered=rows.length>0;
      el.empty.querySelector("h3").textContent=filtered?"אין פערים שתואמים את הסינון":"אין פערים ברשימה";
      el.empty.lastElementChild.textContent=filtered
        ? "נקו את החיפוש או בחרו סטטוס אחר."
        : "הוסיפו פער בשורה התחתונה של הטבלה. כל מי שיפתח את הדף יראה אותו מיד.";
    }
    if(memo){
      var back=el.rows.querySelector('[data-id="'+memo.id+'"][data-field="'+memo.f+'"]');
      if(back){back.focus(); if(memo.s!=null&&back.setSelectionRange){try{back.setSelectionRange(memo.s,memo.s);}catch(e){}}}
    }
  }
  function td(cls,lbl,child){
    var c=document.createElement("td"); c.className=cls;
    if(lbl) c.setAttribute("data-lbl",lbl);
    c.appendChild(child); return c;
  }
  function input(r,field,ph){
    var i=document.createElement("input");
    i.className="cell"; i.value=r[field]||""; i.placeholder=ph;
    i.dataset.id=r.id; i.dataset.field=field;
    i.addEventListener("input",function(){debounced(r.id,field,i.value);});
    return i;
  }
  function select(r,field,values){
    var s=document.createElement("select");
    s.className="cell"; s.dataset.id=r.id; s.dataset.field=field;
    var vals=values.slice();
    if(r[field]&&vals.indexOf(r[field])===-1) vals.unshift(r[field]);
    if(!r[field]) vals.unshift("");
    vals.forEach(function(v){ s.appendChild(opt(v, v===""?"—":v)); });
    s.value=r[field]||"";
    s.addEventListener("change",function(){
      var p={}; p[field]=s.value; writeRow(r.id,p);
      if(field==="location") render();
    });
    return s;
  }
  function statusSelect(r){
    var s=document.createElement("select");
    s.className="st "+CLS[r.status]; s.dataset.id=r.id; s.dataset.field="status";
    s.setAttribute("aria-label","סטטוס הפער");
    STATUSES.forEach(function(v){ s.appendChild(opt(v)); });
    s.value=r.status;
    s.addEventListener("change",function(){ writeRow(r.id,{status:s.value}); render(); });
    return s;
  }

  /* ---------------- ייצוא ---------------- */
  $("export").addEventListener("click",function(){
    var esc=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';};
    var lines=[["#","פלוגה","פער","מיקום","סטטוס","הערות"].map(esc).join(",")];
    visible().forEach(function(r,i){
      lines.push([i+1,r.company,r.gap,r.location,r.status,r.note].map(esc).join(","));
    });
    var blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(courseName?courseName.replace(/[\\/:*?"<>|]/g,"")+" - ":"")+"פועלי בניין.csv";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },0);
  });

  /* ---------------- אירועים ---------------- */
  $("add").addEventListener("click",addRow);
  [el.nGap,el.nNote].forEach(function(f){
    f.addEventListener("keydown",function(e){ if(e.key==="Enter") addRow(); });
  });
  el.nStatus.addEventListener("change",function(){
    el.nStatus.className="cell st "+CLS[el.nStatus.value];
  });
  el.nLocation.addEventListener("change",function(){
    el.nNote.placeholder = NEEDS_DETAIL[el.nLocation.value]||"הערות";
  });
  Array.prototype.forEach.call(document.querySelectorAll(".key"),function(k){
    k.addEventListener("click",function(){
      fStatus=(fStatus===k.dataset.f&&k.dataset.f!=="all")?"all":k.dataset.f; render();
    });
  });
  el.q.addEventListener("input",render);
  el.fLocation.addEventListener("change",render);

  var ct;
  el.course.addEventListener("input",function(){
    courseName=el.course.value;
    document.title=(courseName?courseName+" — ":"")+"פועלי בניין";
    clearTimeout(ct);
    ct=setTimeout(function(){
      sb.from("settings").update({course_name:courseName}).eq("id",1).then(function(){});
    },600);
  });

  render();
})();
</script>
</body>
</html>
